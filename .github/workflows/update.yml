name: Sync FC3D Data

on:
  schedule:
    - cron: '30,45 13 * * *'
    - cron: '*/15 14 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'update_data.py'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: fc3d-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and rebuild 3d_data.js
        run: python update_data.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 3d_data.js
          if git diff --cached --quiet; then
            echo "No data change, skipping commit"
          else
            git commit -m "chore: sync fc3d data"
            git push
          fi
